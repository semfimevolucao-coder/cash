<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Envio FaucetPay via Servidor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }
    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      font-size: 14px;
      box-sizing: border-box;
    }
    input, select {
      background: #0f172a;
      color: #f8fafc;
    }
    button {
      margin-top: 20px;
      background: #16a34a;
      color: #ffffff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #15803d;
    }
    pre {
      margin-top: 18px;
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Teste de Pagamento FaucetPay (Backend)</h2>
    <p style="font-size: 13px; color: #94a3b8;">
      A chave de API fica apenas no servidor do Render. Esta página apenas envia os dados do teste para <code>/api/teste-pagamento-faucetpay</code>.
    </p>

    <form id="formTeste">
      <label for="token">Token de Teste do Servidor (ADMIN_TEST_TOKEN)</label>
      <input id="token" type="password" required placeholder="Digite o token configurado no Render" />

      <label for="to">E-mail ou Username FaucetPay Destinatário</label>
      <input id="to" type="text" required value="chensonbh763@gmail.com" />

      <label for="currency">Moeda</label>
      <select id="currency">
        <option value="USDT" selected>USDT</option>
        <option value="BTC">BTC</option>
        <option value="TRX">TRX</option>
        <option value="DOGE">DOGE</option>
        <option value="LTC">LTC</option>
      </select>

      <label for="amount">Quantidade na Moeda (ex.: 0.00052077)</label>
      <input id="amount" type="number" step="any" min="0.00000001" max="0.01" required value="0.00052077" />

      <button type="submit">Enviar Teste pelo Servidor</button>
    </form>

    <pre id="resultado">Aguardando envio...</pre>
  </div>

  <script>
    const form = document.getElementById('formTeste');
    const resultado = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultado.textContent = 'Enviando requisição para o servidor...';

      const payload = {
        to: document.getElementById('to').value.trim(),
        currency: document.getElementById('currency').value,
        amount: Number(document.getElementById('amount').value)
      };

      const token = document.getElementById('token').value.trim();

      try {
        const resp = await fetch('/api/teste-pagamento-faucetpay', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-test-token': token
          },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();
        resultado.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultado.textContent = 'Erro de rede ao falar com o servidor: ' + err.message;
      }
    });
  </script>
</body>
</html>
